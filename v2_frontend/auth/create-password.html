<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Password | WebPilot OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/v2/new.css">
  <link rel="stylesheet" href="/v2/auth/auth.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-header">
      <a href="/v2/" class="auth-logo">WEBPILOT</a>
      <h1 class="auth-title">Secure your account</h1>
      <p class="auth-subtitle">Choose a strong password.</p>
    </div>

    <form id="create-password-form" class="auth-form" novalidate>
      <div class="input-group">
        <label for="password" class="input-label">Password</label>
        <input type="password" id="password" class="auth-input" placeholder="Min. 8 characters" autocomplete="new-password" required>
        <button type="button" class="pwd-toggle" tabindex="-1" data-target="password" aria-label="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <div id="pwd-strength" class="pwd-strength">
          <div class="pwd-strength-bar"></div>
          <div class="pwd-strength-bar"></div>
          <div class="pwd-strength-bar"></div>
        </div>
      </div>

      <div class="input-group">
        <label for="confirm_password" class="input-label">Confirm Password</label>
        <input type="password" id="confirm_password" class="auth-input" placeholder="Repeat password" autocomplete="new-password" required>
        <button type="button" class="pwd-toggle" tabindex="-1" data-target="confirm_password" aria-label="Show confirm password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <button type="submit" class="btn-primary" disabled>Complete Account</button>
    </form>
  </div>
  <script src="/v2/auth/auth.js"></script>
</body>
</html>
