<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | WebPilot OS</title>
  <link rel="stylesheet" href="../new.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-header">
      <a href="../new.html" class="auth-logo">WEBPILOT</a>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your account.</p>
    </div>
    
    <form id="login-form" class="auth-form" method="POST" action="/login" novalidate>
      <div class="input-group">
        <label for="identifier" class="input-label">Full Name or Nickname</label>
        <input type="text" id="identifier" class="auth-input" placeholder="How you are identified" required>
      </div>
      
      <div class="input-group">
        <label for="email" class="input-label">Email Address</label>
        <input type="email" id="email" name="email" class="auth-input" placeholder="mohit@example.com" required>
      </div>
      
      <div class="input-group">
        <label for="password" class="input-label">Password</label>
        <input type="password" id="password" name="password" class="auth-input" placeholder="Your password" required>
        <button type="button" class="pwd-toggle" tabindex="-1" data-target="password" aria-label="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      
      {% if error %}
      <div class="error-message visible" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 16px; text-align: center; display: block;">
        {{ error }}
      </div>
      {% endif %}
      <button type="submit" class="btn-primary">Sign In</button>
    </form>
    
    <div class="auth-footer-link">
      Don't have an account? <a href="register.html">Register</a>
    </div>
  </div>
  <script src="auth.js"></script>

</body>
</html>
