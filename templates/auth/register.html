<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | WebPilot OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../new.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <div class="auth-container register-size">
    <div class="auth-header">
      <a href="../new.html" class="auth-logo">WEBPILOT</a>
      <h1 class="auth-title">Join us in a Snap</h1>
      <p class="auth-subtitle">Join the autonomous web operator engine.</p>
    </div>

    <form id="register-form" class="auth-form" method="POST" action="/register" novalidate>
      <div class="input-group">
        <label for="full_name" class="input-label">Full Name</label>
        <input type="text" id="full_name" name="full_name" class="auth-input" placeholder="John Doe" autocomplete="name" required>
      </div>

      <div class="input-group">
        <label for="email" class="input-label">Email Address</label>
        <input type="email" id="email" name="email" class="auth-input" placeholder="example@site.com" autocomplete="email" required>
      </div>

      <div class="input-group">
        <label for="mobile_local" class="input-label">Phone Number</label>
        <div class="phone-row">
          <div class="custom-dropdown" id="country_dropdown">
            <button type="button" class="dropdown-trigger" id="country_trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="Select Country Code">
              <span id="selected_country_value">+91</span>
              <svg class="dropdown-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <ul class="dropdown-menu" id="country_menu" role="listbox" aria-label="Country Code Options">
              <li class="dropdown-item selected" data-value="+91" role="option" aria-selected="true">+91 IN</li>
              <li class="dropdown-item" data-value="+1" role="option" aria-selected="false">+1 US</li>
              <li class="dropdown-item" data-value="+44" role="option" aria-selected="false">+44 UK</li>
              <li class="dropdown-item" data-value="+61" role="option" aria-selected="false">+61 AU</li>
              <li class="dropdown-item" data-value="+971" role="option" aria-selected="false">+971 AE</li>
              <li class="dropdown-item" data-value="+65" role="option" aria-selected="false">+65 SG</li>
            </ul>
            <input type="hidden" id="country_code" value="+91">
          </div>
          <input type="tel" id="mobile_local" class="auth-input" placeholder="9876543210" inputmode="numeric" autocomplete="tel-national" required>
        </div>
      </div>

      <div class="input-group">
        <label for="password" class="input-label">Password</label>
        <input type="password" id="password" name="password" class="auth-input" placeholder="Minimum 8 characters" autocomplete="new-password" required>
        <button type="button" class="pwd-toggle" data-target="password" aria-label="Toggle password visibility">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <div class="pwd-strength" id="pwd-strength">
          <div class="pwd-strength-bar"></div>
          <div class="pwd-strength-bar"></div>
          <div class="pwd-strength-bar"></div>
        </div>
      </div>

      <div class="input-group">
        <label for="confirm_password" class="input-label">Confirm Password</label>
        <input type="password" id="confirm_password" class="auth-input" placeholder="Minimum 8 characters" autocomplete="new-password" required>
        <button type="button" class="pwd-toggle" data-target="confirm_password" aria-label="Toggle password visibility">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="terms-row">
        <span class="terms-text">Accept our <a href="#" target="_blank">Terms of Service</a> and <a href="#" target="_blank">Privacy Policy</a>.</span>
        <button type="button" id="terms-toggle" class="toggle-switch" role="switch" aria-checked="false" aria-label="Accept Terms and Conditions">
          <span class="toggle-thumb" id="terms-thumb"></span>
        </button>
      </div>

      {% if error %}
      <div class="error-message visible" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 16px; text-align: center; display: block;">
        {{ error }}
      </div>
      {% endif %}
      <button type="submit" id="submit-btn" class="btn-primary" disabled>Create Account</button>
    </form>

    <div class="auth-footer-link">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
